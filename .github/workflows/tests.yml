name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # The oldest maintained Node, and the newest.
        node: ["22", "node"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node --test

  browsers:
    name: Browsers
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: node
      # Ubuntu keeps Chrome from sandboxing itself.
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: node --test tests/browsers.js
        env:
          BROWSERS: google-chrome microsoft-edge firefox
