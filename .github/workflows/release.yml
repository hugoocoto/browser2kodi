name: release

# Pushing a tag vX.Y.Z, the version in extension/manifest.json, publishes it
# on addons.mozilla.org (AMO), with the listing in amo-listing.json, and as a
# GitHub release with the extension for Chrome (a zip to load unpacked) and
# for Firefox (the .xpi Mozilla signs once it approves the version). The
# AMO_JWT_ISSUER and AMO_JWT_SECRET secrets hold an AMO API key.
#
# The release goes out right away; the firefox job adds the .xpi once Mozilla
# approves it. If that takes over half an hour, run the workflow by hand with
# the version: Actions > release > Run workflow, or
# gh workflow run release.yml -f version=X.Y.Z

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version whose Firefox add-on to add to its release, e.g. 0.3.1"
        required: true

permissions:
  contents: write

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: node

      - name: Check the tag is the manifest's version
        run: |
          version=$(node -p 'require("./extension/manifest.json").version')
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::The tag is $GITHUB_REF_NAME, but extension/manifest.json says $version"
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: node --test

      - run: node build.js

      - name: Chrome
        run: |
          mkdir out
          cp -r dist/chrome browser2kodi
          zip -r "out/browser2kodi-$VERSION-chrome.zip" browser2kodi

      - name: Firefox
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: |
          npx --yes web-ext@10 sign --channel=listed --amo-metadata=amo-listing.json \
            --source-dir=dist/firefox --approval-timeout=0 \
            --api-key="$AMO_JWT_ISSUER" --api-secret="$AMO_JWT_SECRET"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<EOF
          ## Install

          - **Firefox** (and LibreWolf, Waterfox, Zen, Floorp): install it from [addons.mozilla.org](https://addons.mozilla.org/firefox/addon/browser2kodi/), or open **browser2kodi-$VERSION-firefox.xpi** below with Firefox. If either isn't there yet, Mozilla is still reviewing this version.
          - **Chrome** (and Chromium, Brave, Vivaldi, Edge, Opera, Helium): unzip **browser2kodi-$VERSION-chrome.zip** below, open \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and pick the \`browser2kodi\` folder.

          Then enter your Kodi's address in the options that open. More in the [README](https://github.com/$GITHUB_REPOSITORY#install).
          EOF
          gh release create "$GITHUB_REF_NAME" out/* --title "browser2kodi $VERSION" \
            --notes-file notes.md --generate-notes

  firefox:
    name: Add the Firefox add-on
    needs: release
    if: ${{ !cancelled() && (needs.release.result == 'success' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: node
      - env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: |
          version=${VERSION#v}
          xpi="browser2kodi-$version-firefox.xpi"
          node amo.js "$version" "$xpi" 30 || {
            [ $? -eq 3 ] && echo "::warning::Mozilla is still reviewing $version. Run this workflow again once it's approved."
            exit 1
          }
          gh release upload "v$version" "$xpi" --clobber
